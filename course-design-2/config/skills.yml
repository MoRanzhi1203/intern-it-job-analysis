# ---- Stage 13 技能 EDA 榜单层级（层级视图；技能分类本身仍完全由 feature_family / group 决定） ----
# 需要该视图的原因：现有 group 无法完全区分「具体技术技能」与「技术方向 / 领域概念」——
#   AI算法技能、大模型技能、网络与安全、技术领域 四个组内同时含两类概念，
# 因此按提示词 §17 在 skills.yml 内做最小补充：只声明层级视角 + 少量领域概念技能，
# 不新建第二套技能分类字典；每个技能按下列顺序归属第一个命中的层级。
#   A 具体技术技能：语言 / 框架 / 数据库 / 工具 / 算法库（用于「需要掌握哪些具体技术」）
#   B 技术领域：方向与领域概念（用于「岗位集中在哪些技术方向」）
#   C 业务能力：产品 / 运营 / 项目管理等
#   D 办公工具：Excel / PPT / Word / 办公软件 / BI 工具
rank_layers:
  办公工具:
    groups: [办公工具]
  业务能力:
    families: [业务能力]
  技术领域:
    groups: [技术领域]
    skills: [大模型, 机器学习, 深度学习, NLP, 计算机视觉, 推荐系统, 数据挖掘, 时间序列,
             强化学习, 语音识别, 知识图谱, 数据分析, 数据科学, 网络安全, 信息安全]
  具体技术技能:
    families: [技术技能, 工程工具, 数据工具]
