# -*- coding: utf-8 -*-
# IT 技能实体标准化配置（唯一权威来源）
#
# 设计原则：
# 1. 禁止把技能词典散落硬编码在业务脚本中，全部技能与别名必须写在本文件；
# 2. 三级结构：feature_family（一级类型）→ group（二级类别）→ canonical（标准实体）；
#    一级类型只在 feature_families 中显式配置，禁止运行时临时猜类别；
# 3. canonical 为技能标准名，写入数据表的技能集合一律使用标准名；
# 4. aliases 为可匹配的别名（可省略，canonical 本身始终参与匹配）；
# 5. 拉丁短词（C / R / Go / AI / ML / DL / CV 等）必须走严格规则：
#    - strict_case_aliases 中的别名要求大小写完全一致；
#    - 长度 <= short_term_max_length 的拉丁别名必须左右词边界成立；
#    - blocklist 命中的片段（如 R&D、C位）直接丢弃，避免误匹配。

version: 2

# 拉丁别名长度不超过该值时，强制要求词边界（前后不能是字母/数字/_）
short_term_max_length: 4

# ---- 一级类型（feature_family）→ 二级类别（group）显式映射 ----
# 每个 group 必须且只能归属一个 feature_family，否则加载配置直接报错。
feature_families:
  技术技能:
    - 编程语言
    - 数据库
    - 前端技术
    - 后端技术
    - 大数据技术
    - 数据采集
    - AI算法技能
    - AI框架
    - 大模型技能
    - 网络与安全
  工程工具:
    - 工程与运维工具
    - 测试工具
  数据工具:
    - 数据分析工具
    - 办公工具
  业务能力:
    - 产品业务能力
    - 运营业务能力
  技术领域:
    - 技术领域

# AI 技能组（AI技能数口径 = 岗位技能集合中落在这些组的标准实体数量）
ai_skill_groups:
  - AI算法技能
  - AI框架
  - 大模型技能

# 岗位级技能画像中的分组计数口径（组名必须已在 feature_families 中登记）
language_skill_groups: [编程语言]
database_skill_groups: [数据库]
security_skill_groups: [网络与安全]
office_skill_groups: [办公工具]

# ---- 歧义词的上下文规则 ----
# 规则只作用于 match_aliases 中列出的别名：命中后必须在匹配位置附近（窗口）满足
# require_any 至少一项，且不得命中 exclude_any 任一项，否则该次匹配被丢弃并计入歧义排除统计。
# 例：Agent 只有在「AI Agent / Agent开发 / 智能体」等可靠上下文中才算 AI Agent，
#     User-Agent / 网络代理 一律排除；Word 排除 Word2Vec / word embedding。
ambiguous_context_rules:
  Agent:
    match_aliases: [Agent]
    require_any: [AI Agent, LLM Agent, Agent开发, Agent框架, Agent应用, Agentic, Agent 开发,
                  智能体, 多智能体, 智能体开发, 大模型 Agent, 多 Agent]
    exclude_any: [User-Agent, user-agent, user agent, browser agent, 代理服务器, 网络代理,
                  代理设置, Proxy, 代理]
  Word:
    match_aliases: [Word, word]
    require_any: [Microsoft Word, microsoft word, Word文档, word文档, Word 文档, 熟练使用Word,
                  熟练使用word, Word排版, word排版, Office, 办公软件, WPS]
    exclude_any: [Word2Vec, word2vec, Word2vec, word embedding, word vector, word2vec模型,
                  word embeddings]
  C:
    match_aliases: [C]
    require_any: [C语言, C/C++, C / C++, C、C++, C和C++, C＋＋, C++]
    exclude_any: []
  R:
    match_aliases: [R]
    require_any: [R语言, RStudio, R studio, R语言开发, R语言编程]
    exclude_any: []
  Go:
    match_aliases: [Go]
    require_any: [Go语言, Golang, golang, Go 语言, Go开发, GO语言]
    exclude_any: []
  Spring:
    match_aliases: [Spring, spring]
    require_any: [Spring, spring, Spring Boot, SpringBoot, Spring Cloud, SpringMVC, Spring MVC]
    exclude_any: [spring festival]
  React:
    match_aliases: [React, react]
    require_any: [React, react, React.js, ReactJS, React Native]
    exclude_any: [reaction, reactive]

# 歧义规则命中窗口（匹配位置左右各取该字符数参与上下文判定）
ambiguous_context_window: 30

# 高歧义短词：必须大小写完全一致，且必须满足词边界
strict_case_aliases:
  - C
  - R
  - Go
  - AI
  - ML
  - DL
  - CV
  - SQL
  - JS
  - TS
  - .NET

# 误匹配黑名单：这些片段内部不允许命中技能
blocklist:
  - R&D
  - R & D
  - C位
  - C 位
  - Golang语言标准库以外的Go to
  - AIpha

