# -*- coding: utf-8 -*-
# 结构化业务字段清洗配置（唯一权威来源）
#
# 设计原则：
# 1. 所有映射与识别规则写在本文件，禁止散落硬编码在脚本里；
# 2. 只做「平台自有取值 → 结构化数值」的显式映射，不做任何模糊合并；
# 3. 逻辑无效值（上下限倒置、非正数）单独标记，禁止静默删除或填补；
# 4. 数值分档阈值只使用平台自身给出的档位边界，不引入人工设定的阈值。

version: 1

# ---- 薪资字段解析 ----
salary:
  # 平台单位标记（本次数据全量为「元/天」，不显式写「元」）
  daily_unit_tokens: ['/天', '/日']
  # 面议标记
  negotiable_tokens: ['面议', '薪资面议']
  # 区间分隔符
  range_separators: ['-', '~', '—', '－', '至', '到']
  # 币种与单位换算表：仅当文本中出现对应 token 时启用；本次数据未出现，保持空表
  amount_multipliers: {}

# ---- 学历要求 → 有序等级 ----
education_levels:
  不限: 0
  大专: 1
  本科: 2
  硕士: 3
  博士: 4

# ---- 每周到岗要求 ----
weekly_attendance:
  pattern: '^(\d{1,2})\s*天'
  unit: '天/周'

# ---- 实习时长要求 ----
internship_duration:
  pattern: '^实习\s*(\d{1,2})\s*个月'
  fallback_pattern: '(\d{1,2})\s*个月'
  unit: '个月'

# ---- 公司规模 ----
company_scale:
  # 人数区间：15-50人 / 50-200人
  range_pattern: '^(\d+)\s*[-–—~]\s*(\d+)\s*人$'
  # 少量取值缺少「人」字但形态仍是人数区间（如 100-200），单独记录
  range_pattern_no_unit: '^(\d+)\s*[-–—~]\s*(\d+)$'
  # 下限开区间：少于15人 / 15人以下
  less_pattern: '^(?:少于|小于|不足)\s*(\d+)\s*人$'
  less_suffix_pattern: '^(\d+)\s*人以下$'
  # 上限开区间：2000人以上
  more_pattern: '^(\d+)\s*人以上$'
  # 单值：200人
  single_pattern: '^(\d+)\s*人$'
  # 平台自有档位边界（用于规模等级分档，来自平台标签本身，非人工设定）
  level_boundaries: [15, 50, 150, 500, 2000]
  level_labels:
    1: '少于15人'
    2: '15-50人'
    3: '50-150人'
    4: '150-500人'
    5: '500-2000人'
    6: '2000人以上'

# ---- 源记录公司属性语义槽位异常（正式名称，禁止再写「字段错位」） ----
# 取证结论（172,063 条原始观测，docs/records/15_company_attribute_semantic_anomaly_record.md）：
#   MySQL 与 Stage 00 raw Parquet 同 ID 30 列完全一致（467/467），
#   即该异常**来自源记录本身**，不是导出/迁移过程造成。
# 症状：公司性质栏位写着人数区间 451 行、公司规模栏位写着地点文本 356 行、两类同时 340 行，
#       候选并集 467 行，且这些行的「公司所在地」全部为空。
# 修复只在 Stage 01 工作副本执行一次，下游 Stage 只验证、不重复修复。
company_attribute_slot_anomaly:
  # 公司性质栏位是否为「人数区间」形态
  nature_looks_like_scale_pattern: '^\d+\s*[-–—~]?\s*\d*\s*人|^少于\s*\d+\s*人|^\d+\s*人以上'
  # 地点文本判定：命中工作城市词表，或含下列行政区字样
  location_tokens: ['省', '市', '区', '县', '州']
  # 三类异常（条件均要求「公司所在地为空」）
  anomaly_types:
    FULL_SHIFT: '公司性质像人数规模 且 公司规模像地点 且 公司所在地为空'
    NATURE_ONLY: '公司性质像人数规模 且 公司规模非地点 且 公司所在地为空'
    SIZE_ONLY: '公司性质正常 且 公司规模像地点 且 公司所在地为空'
  # 确定性修复规则（逐类，禁止推断、禁止回填未知性质）
  repair_policy:
    require_location_empty: true
    FULL_SHIFT: '公司规模 ← 原公司性质；公司所在地 ← 原公司规模；公司性质 ← 缺失(pd.NA)'
    NATURE_ONLY: '公司规模 ← 原公司性质；公司性质 ← 缺失(pd.NA)；公司所在地保持原值'
    SIZE_ONLY: '公司所在地 ← 原公司规模；公司规模 ← 缺失(pd.NA)；公司性质保持原值'
    nature_unrecoverable_action: '置为缺失(pd.NA)并标记，禁止众数/同公司/行业/规模推断回填'

# ---- 工作城市标准化 ----
city_normalization:
  # 多城市 / 省市分隔符（含全角逗号，用于「上海,武汉,襄阳」这类多城市值）
  separators: ['/', '-', '—', '·', ',', '，', '、']
  # 需要剥离的省级后缀
  province_suffixes: ['省', '市', '自治区', '特别行政区']
  # 城市名后缀（「徐州市」→「徐州」）
  city_suffixes: ['市']
  # 直辖市（「北京市/北京」这类写法需要去重）
  municipalities: ['北京', '上海', '天津', '重庆']
  max_length: 12
